<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
  </defs>

  <!-- Green rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Outer radar ring -->
  <circle cx="32" cy="32" r="26" stroke="#0a0a0a" stroke-width="2.5" stroke-opacity="0.7" stroke-dasharray="5 3"/>

  <!-- Middle radar ring -->
  <circle cx="32" cy="32" r="18" stroke="#0a0a0a" stroke-width="1.8" stroke-opacity="0.45"/>

  <!-- Inner radar ring -->
  <circle cx="32" cy="32" r="11" stroke="#0a0a0a" stroke-width="1.4" stroke-opacity="0.3"/>

  <!-- Radar sweep line -->
  <line x1="32" y1="32" x2="32" y2="7" stroke="#0a0a0a" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>

  <!-- Radar sweep arc -->
  <path d="M32 32 L32 7 A25 25 0 0 1 52 19 Z" fill="#0a0a0a" fill-opacity="0.12"/>

  <!-- JS text -->
  <text x="32" y="39" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="19" fill="#0a0a0a" letter-spacing="-0.5">JS</text>

  <!-- Crosshair dots -->
  <circle cx="32" cy="6" r="2" fill="#0a0a0a" fill-opacity="0.7"/>
  <circle cx="58" cy="32" r="1.5" fill="#0a0a0a" fill-opacity="0.4"/>
  <circle cx="32" cy="58" r="1.5" fill="#0a0a0a" fill-opacity="0.4"/>
  <circle cx="6" cy="32" r="1.5" fill="#0a0a0a" fill-opacity="0.4"/>

  <!-- Blip dots -->
  <circle cx="42" cy="20" r="2.2" fill="#0a0a0a" fill-opacity="0.65"/>
  <circle cx="22" cy="43" r="1.6" fill="#0a0a0a" fill-opacity="0.35"/>
</svg>
