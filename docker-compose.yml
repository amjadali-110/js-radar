version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./data/scans:/app/data/scans
      - ./backend/instance:/app/backend/instance
    environment:
      - DATABASE_URL=sqlite:////app/backend/instance/js_discovery.db
      - APP_ENV=production
      # Set CORS_ORIGINS to your frontend domain, e.g. https://app.example.com
      # Do NOT use * in production — it allows any origin to call the API.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      # Set a strong random SECRET_KEY in production: openssl rand -hex 32
      - SECRET_KEY=${SECRET_KEY:-}
      # Optional: tighten rate limits for public deployments
      - RATELIMIT_SCAN_CREATE=${RATELIMIT_SCAN_CREATE:-10 per minute}
      - RATELIMIT_DEFAULT=${RATELIMIT_DEFAULT:-120 per minute}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
